<nav class="rail" id="railNav" aria-label="Ana gezinme">
  <div class="rail__top">
    <a class="rail__brand" href="/" aria-label="VORTEX Mentor">
      <span class="rail__mark">{% include "_mark.html" %}</span>
      <span class="rail__word">VORTEX</span>
      <span class="rail__edition">MENTOR</span>
    </a>
    <button class="rail__toggle" id="railToggle" type="button"
            aria-controls="railNav" aria-expanded="true"
            title="Menüyü daralt" aria-label="Menüyü daralt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 7l-5 5 5 5"/><path d="M19 4v16"/>
      </svg>
    </button>
  </div>

  <button class="rail__search" id="railSearch" type="button" title="Sembol ara ( / )">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    <span>Sembol ara</span><span class="rail__kbd">/</span>
  </button>

  <div class="rail__heading">Çalışma alanı</div>
  <div class="rail__group rail__group--primary">
    <a class="rail__item {% if page == 'mentor' %}is-active{% endif %}" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 00-4 12.75V20l4-2 4 2v-4.25A7 7 0 0012 3z"/><path d="M9.5 10.5l1.5 1.5 3.5-3.5"/></svg>
      <span class="rail__label">Mentor</span><span class="rail__tip">Karar Asistanı</span>
    </a>
    <a class="rail__item {% if page == 'portfoy' %}is-active{% endif %}" href="/portfoy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><path d="M8 8V6a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M3 13h18"/></svg>
      <span class="rail__label">Portföy</span><span class="rail__tip">Binance Bakiyesi</span>
    </a>
    <a class="rail__item {% if page in ['markets','rsi'] %}is-active{% endif %}" href="/piyasalar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 5-8 4 5"/><path d="M3 21h18"/></svg>
      <span class="rail__label">Piyasalar</span><span class="rail__tip">Tarayıcı</span>
    </a>
    <a class="rail__item {% if page == 'analiz' %}is-active{% endif %}" href="/analiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V8m5 11V4m5 15v-7m5 7V6"/><path d="M2 21h20"/></svg>
      <span class="rail__label">Grafik</span><span class="rail__tip">Derin Analiz</span>
    </a>
    <a class="rail__item {% if page in ['haber','takvim'] %}is-active{% endif %}" href="/haberler">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span class="rail__label">Gündem</span><span class="rail__tip">Haber ve Takvim</span>
    </a>
  </div>

  <div class="rail__spacer"></div>

  <div class="rail__machine" aria-label="Mentor modu">
    <div class="rail__machine-head"><span class="rail__dot rail__dot--flat"></span><span>Karar desteği</span></div>
    <div class="rail__machine-row"><span>Canlı emir</span><b>KAPALI</b></div>
    <div class="rail__machine-row"><span>Yetki</span><b>SENDE</b></div>
  </div>

  <a class="rail__item {% if page == 'ayarlar' %}is-active{% endif %}" href="/ayarlar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 01-.2 1.7l2 1.6-2 3.4-2.5-1a7 7 0 01-3 1.7L13 22H9l-.4-2.6a7 7 0 01-3-1.7l-2.4 1-2-3.4 2-1.6A7 7 0 013 12c0-.6.1-1.2.2-1.7l-2-1.6 2-3.4 2.5 1a7 7 0 013-1.7L9 2h4l.4 2.6a7 7 0 013 1.7l2.4-1 2 3.4-2 1.6c.1.5.2 1.1.2 1.7z"/></svg>
    <span class="rail__label">Ayarlar</span><span class="rail__tip">Ayarlar</span>
  </a>
</nav>
<button class="mobile-nav-backdrop" id="mobileNavBackdrop" type="button" aria-label="Menüyü kapat" tabindex="-1"></button>
<button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-controls="railNav" aria-expanded="false">
  <svg class="mobile-nav-toggle__menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
  <svg class="mobile-nav-toggle__close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  <span>Panel</span>
</button>
